<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nevermind Studio Store</title>
  <meta http-equiv="refresh" content="0; url=http://localhost:3000/">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #050505;
      color: #f4efe8;
      font-family: Bahnschrift, "Trebuchet MS", sans-serif;
    }

    .redirect-card {
      width: min(92vw, 36rem);
      padding: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 1.5rem;
      background: rgba(255, 255, 255, 0.04);
      text-align: center;
    }

    a {
      color: inherit;
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <h1>Opening Nevermind Store</h1>
    <p>This project runs from the local app server.</p>
    <p><a href="http://localhost:3000/">Open the live store</a></p>
  </div>
  <script>
    window.location.replace("http://localhost:3000/");
  </script>
</body>
</html>
